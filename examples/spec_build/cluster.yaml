# Cluster for the SPEC CPU2006 build: a head + one riscv_build worker whose
# container mounts a writable SPEC2006 install and exposes it as SPEC_DIR.
# Fill every #FILL and the SPEC install path.
cluster_name: spec-build

available_node_types:
    head_local:
        resources: {"head_local": 8}
        num_workers: 1
        worker_env_commands: ["source ~/.bashrc && conda activate chia_env && export PATH=$HOME/.local/bin:$PATH"]
        compatible_ips: #FILL

    riscv_build:
        resources: {"riscv_build": 4}
        num_workers: 1
        docker:
            image: "ghcr.io/ucb-bar/chia-riscv-cross:latest"
            container_name: "chia-riscv-cross-${USER}"
            pull_before_run: True
            run_options:
                - --ulimit nofile=65536:65536
                # Mount the SPEC2006 install at its ORIGINAL path (specperl/runspec
                # shebangs hardcode it), WRITABLE (runspec builds in-tree) and writable
                # by the container uid; SPEC_DIR points at that same path.
                - -v /path/to/spec-cpu2006:/path/to/spec-cpu2006   # FILL
                - -e SPEC_DIR=/path/to/spec-cpu2006                # FILL (match the mount)
        compatible_ips: #FILL

provider:
    type: local
    head_ip: #FILL

auth:
    ssh_user: ${USER}
    ssh_private_key:            # leave unset to use your ssh-agent

file_mounts: {}

rsync_exclude:
    - "**/.git"
    - "**/.git/**"

rsync_filter:
    - ".gitignore"

initialization_commands: []

setup_commands: []

head_env_commands: ["source ~/.bashrc && conda activate chia_env && export PATH=$HOME/.local/bin:$PATH"]

head_start_ray_commands:
    - ray stop
    - ulimit -c unlimited && ray start --head --port=6379 --include-dashboard=True --dashboard-agent-listen-port=0

worker_start_ray_commands:
    - ray stop
    - ray start --address=$RAY_HEAD_IP:6379 --dashboard-agent-listen-port=0
