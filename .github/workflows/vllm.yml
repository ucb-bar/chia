name: vLLM Image

on:
  workflow_dispatch:
  workflow_call:

env:
  OWNER: ghcr.io/ucb-bar

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One image per GPU vendor, same Dockerfile — only the vLLM base differs.
    # fail-fast off so an AMD failure doesn't cancel the NVIDIA push.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chia-vllm
            base: vllm/vllm-openai:latest
          - name: chia-vllm-amd
            base: vllm/vllm-openai-rocm:latest

    steps:
      # The vLLM base (CUDA/ROCm + torch + vllm) is large, plus the chia
      # install — so we evict everything not needed for this build. The build
      # itself needs no GPU (it only layers ray+chia onto the base).
      - name: Show disk before cleanup
        run: df -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/julia* || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /opt/microsoft /opt/google || true
          sudo rm -rf /opt/az || true
          sudo rm -rf /usr/local/share/powershell || true
          docker image prune -af || true
          docker builder prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a tag push this adds the tag verbatim (v1.2.3), so every image
      # carries the same version string as the released chialoops.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.OWNER }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_id }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: dockerfiles/VLLMDockerfile
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VLLM_BASE=${{ matrix.base }}
            CHIA_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.OWNER }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ env.OWNER }}/${{ matrix.name }}:buildcache,mode=max

      - name: Show runner resources
        run: |
          free -h
          df -h
          docker system df || true

  cleanup-old-builds:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write
    strategy:
      matrix:
        name: [chia-vllm, chia-vllm-amd]
    steps:
      - name: Delete build images older than 7 days
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 0
          delete-only-pre-release-versions: false
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore-versions: "^(?!build-).*$"
          min-days-old: 7
