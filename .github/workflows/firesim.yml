name: FireSim Image

# Builds dockerfiles/FireSimDockerfile on top of the chia base: the FireSim
# manager driving one local FPGA. No chipyard, so this does not depend on the
# Chipyard image.

on:
  workflow_dispatch:
  workflow_call:

env:
  IMAGE: ghcr.io/ucb-bar/chia-firesim

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a tag push this adds the tag verbatim (v1.2.3), so every image
      # carries the same version string as the released chialoops.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_id }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: dockerfiles/FireSimDockerfile
          context: .
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/ucb-bar/chia:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  cleanup-old-builds:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write
    steps:
      - name: Delete build images older than 7 days
        uses: actions/delete-package-versions@v5
        with:
          package-name: chia-firesim
          package-type: container
          min-versions-to-keep: 0
          delete-only-pre-release-versions: false
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore-versions: "^(?!build-).*$"
          min-days-old: 7
