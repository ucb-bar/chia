name: FireSim Build Image

# Builds dockerfiles/FireSimBuildDockerfile on top of chia-chisel-build:
# chipyard + FireSim with an sshd, so `firesim buildbitstream` runs unmodified.
# Must run after the Chipyard image.

on:
  workflow_dispatch:
  workflow_call:

env:
  IMAGE: ghcr.io/ucb-bar/chia-firesim-build

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The chia-chisel-build base is ~30GB; without this the build dies on
      # disk space (same cleanup as verilator-run, which pulls it too).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/julia* || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /opt/microsoft /opt/google || true
          sudo rm -rf /opt/az || true
          sudo rm -rf /usr/local/share/powershell || true
          docker image prune -af || true
          docker builder prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a tag push this adds the tag verbatim (v1.2.3), so every image
      # carries the same version string as the released chialoops.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_id }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: dockerfiles/FireSimBuildDockerfile
          context: .
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/ucb-bar/chia-chisel-build:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  cleanup-old-builds:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write
    steps:
      - name: Delete build images older than 7 days
        uses: actions/delete-package-versions@v5
        with:
          package-name: chia-firesim-build
          package-type: container
          min-versions-to-keep: 0
          delete-only-pre-release-versions: false
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore-versions: "^(?!build-).*$"
          min-days-old: 7
