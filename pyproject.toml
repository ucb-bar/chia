[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI distribution is "chialoops" — "chia" is taken by an unrelated
# project. The import package, and the console script, stay "chia".
name = "chialoops"
version = "0.1.0"
description = "The Chia agentic AI flow for hardware"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "UC Berkeley Architecture Research" }]
keywords = ["hardware", "co-design", "chipyard", "agents", "ray"]
# No "License ::" classifier: it is rejected alongside the SPDX license field.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "google-genai>=1.64.0",
    "ray[default]==2.54.0",
    "mcp==1.27.1",
    "pydantic==2.12.4",
    "fastapi==0.121.0",
    "pyyaml==6.0.3",
    "graphviz==0.21",
    "boto3>=1.28.0",
    "google-cloud-compute>=1.19.0",
    "requests>=2.31.0"
]

[project.scripts]
chia = "chia.cli.main:main"

[project.urls]
Homepage = "https://github.com/ucb-bar/chia"
Documentation = "https://docs.chialoops.ai"
Repository = "https://github.com/ucb-bar/chia"
Issues = "https://github.com/ucb-bar/chia/issues"

[project.optional-dependencies]
test = ["pytest==9.0.3"]
tensorboard = ["tensorboardX>=2.6", "tensorboard>=2.14"]
wandb = ["wandb>=0.15"]
metrics = ["tensorboardX>=2.6", "wandb>=0.15"]
postgres = ["psycopg[binary]>=3.2"]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinx-tabs",
    "sphinx-copybutton",
    "sphinx-substitution-extensions",
    "sphinx-autobuild"
]

[tool.pytest.ini_options]
# Import tests under their full package path, not by bare filename.
addopts = "--import-mode=importlib"

[tool.setuptools.package-data]
"chia.trace" = ["*.html"]

[tool.setuptools.packages.find]
# include is load-bearing: pyproject config defaults to namespace discovery,
# which needs no __init__.py, so without it the wheel also ships top-level
# docs/, examples/ and test/ into the installing environment.
include = ["chia*"]
exclude = ["gem5align*", "memcpy*", "dockerfiles*"]
