cluster_name: down_cluster_b

available_node_types:
    worker:
        resources: {"generic_b": 1}
        min_workers: 1
        max_workers: 1
        worker_setup_commands: ["source ~/.bashrc && conda activate chia_env"]
        compatible_ips: ["${THIS_MACHINE}"]
    docker_worker:
        resources: {"verilator_run": 1}
        min_workers: 1
        max_workers: 1
        docker:
            image: "ghcr.io/ucb-bar/chia-verilator-run:latest"
            container_name: "chia-verilator-run-${USER}"
            pull_before_run: False
            run_options:
                - --ulimit nofile=65536:65536
                - --shm-size=10.24gb
        compatible_ips: ["${THIS_MACHINE}"]
    unique_docker_worker:
        resources: {"verilator_run": 1}
        min_workers: 1
        max_workers: 1
        docker:
            image: "ghcr.io/ucb-bar/chia-verilator-run:latest"
            container_name: "chia-verilator-run-b-${USER}"
            pull_before_run: False
            run_options:
                - --ulimit nofile=65536:65536
                - --shm-size=10.24gb
        compatible_ips: ["${THIS_MACHINE}"]

provider:
    head_ip: ${THIS_MACHINE}

auth:
    ssh_user: ${USER}
    ssh_private_key: ${HOME}/.ssh/${USER}

head_env_commands: ["source ~/.bashrc && conda activate chia_env"]
head_setup_commands: []

head_start_ray_commands:
    - ulimit -c unlimited && ray start --head --port=6378 --include-dashboard=False --dashboard-agent-listen-port=0 --temp-dir=/tmp/${USER}/down_b

worker_start_ray_commands:
    - ray start --address=$RAY_HEAD_IP:6378 --temp-dir=/tmp/${USER}/down_b
